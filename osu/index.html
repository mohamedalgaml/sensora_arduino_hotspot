<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSU - Shop Welcome</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/icons/favicon.ico">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="assets/images/logo.png" alt="Shop Logo" class="logo">
            <h1>مرحباً بك في Shop_Welcome_OSU</h1>
            <p class="subtitle">خدمة الواي فاي التلقائية</p>
        </div>

        <div class="content">
            <div class="feature-card">
                <div class="icon">🚀</div>
                <h3>اتصال تلقائي</h3>
                <p>اتصال أوتوماتيكي عند دخولك المتجر</p>
            </div>

            <div class="feature-card">
                <div class="icon">🔒</div>
                <h3>آمن ومحمي</h3>
                <p>اتصال مشفر لحماية بياناتك</p>
            </div>

            <div class="feature-card">
                <div class="icon">⚡</div>
                <h3>عالى السرعة</h3>
                <p>إنترنت سريع ومجاني للزوار</p>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="startSignup()">بدء التسجيل</button>
            <button class="btn-secondary" onclick="showTerms()">شروط الاستخدام</button>
        </div>

        <div class="footer">
            <p>© 2024 Shop Welcome. جميع الحقوق محفوظة.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

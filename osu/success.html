<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم التسجيل - Shop Welcome</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="success-message">
            <div class="success-icon">✅</div>
            <h1>تم التسجيل بنجاح!</h1>
            <p>شكراً لتسجيلك في شبكة Shop_Welcome_OSU</p>
            
            <div class="success-details">
                <p><strong>سيتم اتصالك تلقائياً بالشبكة خلال 5 ثوانٍ...</strong></p>
                <p>يمكنك الآن استخدام الإنترنت بشكل آمن وسريع</p>
            </div>

            <div class="countdown">
                <span id="countdown">5</span> ثانية
            </div>

            <button class="btn-primary" onclick="closeWindow()">اغلاق النافذة</button>
        </div>
    </div>

    <script>
        // عد تنازلي للإغلاق التلقائي
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                closeWindow();
            }
        }, 1000);

        function closeWindow() {
            window.close();
        }
    </script>
</body>
</html>
